services:
  chatroom:
    build:
      context: .
      pull: false
    container_name: local-chatroom
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    environment:
      - NODE_ENV=production
