server:
  port: 3000
  upload_limit: 52428800

message:
  retention_days: 30
  cleanup_time: "03:00"

rooms:
  default: "大厅"
  max_rooms: 20

files:
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".webp"
    - ".svg"
    - ".mp4"
    - ".webm"
    - ".mp3"
    - ".wav"
    - ".ogg"
    - ".pdf"
    - ".zip"
    - ".rar"
    - ".7z"
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    - ".txt"
    - ".md"
